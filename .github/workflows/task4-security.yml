name: Task 4 API Security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-api-security:
    name: Secret scan, contract checks, tests, and ZAP DAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history for secret scanning
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Git history for exposed secrets (redacted)
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo"
          -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git --config=/repo/.gitleaks.toml --redact --no-banner .

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Verify pinned pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: task4-public-endpoint-shielding

      - name: Lint OpenAPI contract with Spectral
        run: pnpm lint:openapi
        working-directory: task4-public-endpoint-shielding

      - name: Run integration tests
        run: pnpm test
        working-directory: task4-public-endpoint-shielding

      - name: Type-check TypeScript
        run: pnpm typecheck
        working-directory: task4-public-endpoint-shielding

      - name: Start the synthetic loopback API
        run: |
          TASK4_HOST=127.0.0.1 TASK4_PORT=3001 pnpm start > /tmp/task4-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/health >/dev/null; then
              echo "Synthetic API is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/task4-api.log
          exit 1
        working-directory: task4-public-endpoint-shielding

      - name: Scan local OpenAPI service with OWASP ZAP
        run: |
          mkdir -p task4-public-endpoint-shielding/artifacts
          chmod 777 task4-public-endpoint-shielding/artifacts
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/zap/wrk/:rw" \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
              -t /zap/wrk/task4-public-endpoint-shielding/openapi.yaml \
              -f openapi \
              -c /zap/wrk/task4-public-endpoint-shielding/zap-rules.tsv \
              -I \
              -r /zap/wrk/task4-public-endpoint-shielding/artifacts/zap-report.html \
              -J /zap/wrk/task4-public-endpoint-shielding/artifacts/zap-report.json

      - name: Upload ZAP reports when created
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task4-zap-api-report
          path: task4-public-endpoint-shielding/artifacts/zap-report.*
          if-no-files-found: ignore
          retention-days: 14
